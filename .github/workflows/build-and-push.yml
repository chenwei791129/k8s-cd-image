name: Build and push image

# Builds the image versions that release.yml tags. Every image version
# `X.Y.Z.R` (kubectl version `vX.Y.Z` plus image revision R) is built once from
# the commit its version tag `vX.Y.Z.R` points to and never pushed again. The
# floating tags are moved along with it:
#   - `X.Y.Z` when R is the newest image revision of that kubectl version;
#   - `X.Y` when, in addition, X.Y.Z is the newest version-tagged patch of the
#     minor;
#   - `latest` when, in addition, X.Y.Z is the highest version-tagged kubectl
#     version.
# A pull request builds the newest kubectl version without pushing it.
#
# A failed tag build is retried with "Re-run all jobs", so the plan sees the
# current version tags again ("Re-run failed jobs" would reuse the old plan).
# If the image version was already pushed, the re-run does nothing, so an
# image whose signing failed has to be signed by hand. When two image versions
# that share a floating tag build at the same time, that tag can end on the
# one that finishes last until another image version moves it (e.g. a `force`
# release).
on:
  push:
    # Only version tags; the three-part `vX.Y.Z` tags are history.
    tags: ['v*.*.*.*']
  pull_request:

# Superseded pull request runs are cancelled. Each tag build has its own group
# and is never cancelled.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request'
    && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      kubectl_version: ${{ steps.plan.outputs.kubectl_version }}
      tags: ${{ steps.plan.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The floating tags are derived from all version tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Decide what to build
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail

          # Lists the version tags (vX.Y.Z.R) matching a git tag pattern.
          version_tags() {
            git tag --list "$1" |
              { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' || true; }
          }

          # Prints the newest version-tagged kubectl version (vX.Y.Z)
          # matching a git tag pattern, or nothing.
          newest_kubectl() {
            version_tags "$1" | sed -E 's/\.[0-9]+$//' | sort -V | tail -n 1
          }

          output() {
            echo "$1=$2"
            echo "$1=$2" >> "${GITHUB_OUTPUT}"
          }

          case "${EVENT_NAME}" in
            push)
              if [[ "${REF_TYPE}" != tag ||
                ! "${REF_NAME}" =~ ^(v([0-9]+\.[0-9]+)\.[0-9]+)\.[0-9]+$ ]]
              then
                echo "::error::'${REF_NAME}' is not a vX.Y.Z.R version tag"
                exit 1
              fi
              kubectl_version="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              image_version="${REF_NAME#v}"

              # An image version is never pushed twice, so re-running the
              # build of a published one does nothing.
              if inspect=$(skopeo inspect --raw \
                "docker://${IMAGE}:${image_version}" 2>&1); then
                echo "::notice::${IMAGE}:${image_version} already exists"
                output build false
                exit 0
              elif [[ "${inspect}" != *"manifest unknown"* ]]; then
                echo "${inspect}"
                echo "::error::Cannot check ${IMAGE}:${image_version}"
                exit 1
              fi

              newest_revision=$(
                version_tags "${kubectl_version}.*" | sort -V | tail -n 1
              )
              newest_patch=$(newest_kubectl "v${minor}.*")
              newest=$(newest_kubectl 'v*')

              # metadata-action tag rules. The image version has the highest
              # priority, so it also becomes the
              # org.opencontainers.image.version label. Each floating tag
              # requires the previous one.
              tags="type=raw,value=${image_version},priority=1000"
              if [[ "${REF_NAME}" == "${newest_revision}" ]]; then
                tags+=$'\n'"type=raw,value=${kubectl_version#v}"
                if [[ "${kubectl_version}" == "${newest_patch}" ]]; then
                  tags+=$'\n'"type=raw,value=${minor}"
                  if [[ "${kubectl_version}" == "${newest}" ]]; then
                    tags+=$'\n'"type=raw,value=latest"
                  fi
                fi
              fi
              ;;
            pull_request)
              # Nothing is pushed, so only the kubectl version matters. Before
              # the first version tag exists, the history tags are used.
              kubectl_version=$(newest_kubectl 'v*')
              if [[ -z "${kubectl_version}" ]]; then
                kubectl_version=$(
                  git tag --list 'v*' |
                    { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } |
                    sort -V | tail -n 1
                )
              fi
              if [[ -z "${kubectl_version}" ]]; then
                echo "::error::No kubectl version tags found"
                exit 1
              fi
              tags=""
              ;;
            *)
              echo "::error::Unsupported event: ${EVENT_NAME}"
              exit 1
              ;;
          esac

          output build true
          output kubectl_version "${kubectl_version}"
          echo "Tag rules:"
          echo "${tags}"
          {
            echo "tags<<EOF_TAGS"
            echo "${tags}"
            echo "EOF_TAGS"
          } >> "${GITHUB_OUTPUT}"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
      # Exchanged for an ephemeral sigstore certificate by cosign's keyless
      # signing; the shared workflow skips signing on pull requests.
      id-token: write
    uses: chenwei791129/.github/.github/workflows/build-and-push-image.yml@main
    with:
      enable-branch-tag: false
      enable-semver-tags: false
      # metadata-action's `latest=auto` only adds `latest` for semver, pep440,
      # match and tag-ref rules, not for raw ones, so the plan job decides
      # `latest` as a raw rule too.
      enable-latest-tag: false
      additional-tags: ${{ needs.plan.outputs.tags }}
      build-args: |
        KUBECTL_VERSION=${{ needs.plan.outputs.kubectl_version }}
      sign-image: true
